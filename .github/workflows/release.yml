name: Release on version change

on:
  push:
    paths:
      - gradle.properties
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          $Utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $Utf8NoBom
          [Console]::OutputEncoding = $Utf8NoBom
          $global:OutputEncoding = $Utf8NoBom

          function Get-GradleProperty {
              param(
                  [Parameter(Mandatory)] [string] $Content,
                  [Parameter(Mandatory)] [string] $Name
              )

              $escapedName = [regex]::Escape($Name)
              $match = [regex]::Match(
                  $Content,
                  "(?m)^\s*$escapedName\s*=\s*([^\r\n]+?)\s*$"
              )
              if (-not $match.Success) {
                  throw "gradle.properties is missing $Name"
              }
              return $match.Groups[1].Value.Trim()
          }

          $propertiesPath = Join-Path $env:GITHUB_WORKSPACE 'gradle.properties'
          $currentContent = [System.IO.File]::ReadAllText($propertiesPath, $Utf8NoBom)
          $versionName = Get-GradleProperty -Content $currentContent -Name 'anonVersionName'
          $versionCodeText = Get-GradleProperty -Content $currentContent -Name 'anonVersionCode'

          if ($versionName -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
              throw "Invalid anonVersionName: $versionName"
          }

          [int] $versionCode = 0
          if (-not [int]::TryParse($versionCodeText, [ref] $versionCode) -or $versionCode -lt 1) {
              throw "Invalid anonVersionCode: $versionCodeText"
          }

          $changed = $env:EVENT_NAME -eq 'workflow_dispatch'
          $isInitialPush = [string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -or $env:BEFORE_SHA -match '^0+$'

          if (-not $changed -and $isInitialPush) {
              $changed = $true
          }
          elseif (-not $changed) {
              $previousLines = & git show "${env:BEFORE_SHA}:gradle.properties"
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to read gradle.properties at $env:BEFORE_SHA"
              }

              $previousContent = $previousLines -join "`n"
              $previousVersionName = Get-GradleProperty -Content $previousContent -Name 'anonVersionName'
              $previousVersionCodeText = Get-GradleProperty -Content $previousContent -Name 'anonVersionCode'
              [int] $previousVersionCode = 0
              if (-not [int]::TryParse($previousVersionCodeText, [ref] $previousVersionCode)) {
                  throw "Invalid previous anonVersionCode: $previousVersionCodeText"
              }

              if ($previousVersionName -eq $versionName) {
                  if ($previousVersionCode -ne $versionCode) {
                      throw 'anonVersionCode changed without changing anonVersionName'
                  }
                  $changed = $false
              }
              else {
                  if ($versionCode -le $previousVersionCode) {
                      throw "anonVersionCode must increase: $previousVersionCode -> $versionCode"
                  }
                  $changed = $true
              }
          }

          $outputLines = @(
              "changed=$($changed.ToString().ToLowerInvariant())"
              "name=$versionName"
              "code=$versionCode"
              "tag=v$versionName"
          )
          [System.IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              ($outputLines -join "`n") + "`n",
              $Utf8NoBom
          )

      - name: Set up Java
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.version.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANONFORWARD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANONFORWARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANONFORWARD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANONFORWARD_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $secretValues = @(
              $env:KEYSTORE_BASE64
              $env:KEYSTORE_PASSWORD
              $env:KEY_ALIAS
              $env:KEY_PASSWORD
          )
          if ($secretValues.Where({ [string]::IsNullOrWhiteSpace($_) }).Count -gt 0) {
              throw 'Release signing secrets are incomplete. See README.md.'
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP 'anonforward-release.jks'
          $keystoreBytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)

      - name: Build signed release APKs
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          ANONFORWARD_KEYSTORE_PATH: ${{ runner.temp }}/anonforward-release.jks
          ANONFORWARD_KEYSTORE_PASSWORD: ${{ secrets.ANONFORWARD_KEYSTORE_PASSWORD }}
          ANONFORWARD_KEY_ALIAS: ${{ secrets.ANONFORWARD_KEY_ALIAS }}
          ANONFORWARD_KEY_PASSWORD: ${{ secrets.ANONFORWARD_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          & bash './gradlew' '--no-daemon' 'assembleReleaseProducts'
          if ($LASTEXITCODE -ne 0) {
              throw "Gradle failed with exit code $LASTEXITCODE"
          }

      - name: Create tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          $expectedAssets = @(
              "outputs/AnonForward-QAux-$env:RELEASE_VERSION.apk"
              "outputs/AnonForward-LSPosed-$env:RELEASE_VERSION.apk"
          )
          foreach ($asset in $expectedAssets) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                  throw "Missing release asset: $asset"
              }
          }

          $releaseExists = $false
          try {
              & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
              $releaseExists = $true
          }
          catch [System.Management.Automation.NativeCommandExitException] {
              $releaseExists = $false
          }

          if ($releaseExists) {
              Write-Output "Release $env:RELEASE_TAG already exists; nothing to do."
              exit 0
          }

          $existingTag = & git tag --list $env:RELEASE_TAG
          if ($existingTag) {
              Write-Output "Using existing tag $env:RELEASE_TAG."
          }

          $arguments = @(
              'release'
              'create'
              $env:RELEASE_TAG
              '--repo'
              $env:GITHUB_REPOSITORY
              '--target'
              $env:GITHUB_SHA
              '--title'
              $env:RELEASE_TAG
              '--notes-file'
              'CHANGELOG.md'
          ) + $expectedAssets

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }

      - name: Validate Xposed Modules Repo token
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          MODULE_REPO_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MODULE_REPO_TOKEN)) {
              throw 'Add the MODULE_REPO_TOKEN Actions secret to synchronize Xposed-Modules-Repo.'
          }

      - name: Checkout Xposed Modules Repo
        if: steps.version.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          repository: Xposed-Modules-Repo/io.github.Morpheus799.QQAnonFwd
          token: ${{ secrets.MODULE_REPO_TOKEN }}
          ref: main
          fetch-depth: 0
          path: xposed-module-repo

      - name: Synchronize VERSION and README
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          $Utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $Utf8NoBom
          [Console]::OutputEncoding = $Utf8NoBom
          $global:OutputEncoding = $Utf8NoBom

          $moduleRepoPath = Join-Path $env:GITHUB_WORKSPACE 'xposed-module-repo'
          $sourceReadmePath = Join-Path $env:GITHUB_WORKSPACE 'README.md'
          $targetReadmePath = Join-Path $moduleRepoPath 'README.md'
          $targetVersionPath = Join-Path $moduleRepoPath 'VERSION'

          [System.IO.File]::Copy($sourceReadmePath, $targetReadmePath, $true)
          [System.IO.File]::WriteAllText(
              $targetVersionPath,
              "$env:RELEASE_VERSION`n",
              $Utf8NoBom
          )

          Push-Location -LiteralPath $moduleRepoPath
          try {
              & git config user.name 'github-actions[bot]'
              & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              $status = & git status --porcelain -- README.md VERSION
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to inspect module repository with exit code $LASTEXITCODE"
              }

              if (-not [string]::IsNullOrWhiteSpace(($status -join "`n"))) {
                  & git add -- README.md VERSION
                  & git commit -m "chore: sync release $env:RELEASE_VERSION"
                  & git push origin HEAD:main
              }
              else {
                  Write-Output 'VERSION and README are already up to date.'
              }
          }
          finally {
              Pop-Location
          }

      - name: Publish APKs to Xposed Modules Repo
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          RELEASE_CODE: ${{ steps.version.outputs.code }}
          MODULE_REPOSITORY: Xposed-Modules-Repo/io.github.Morpheus799.QQAnonFwd
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ($PSVersionTable.PSVersion.Major -ge 7) {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          $moduleTag = "$env:RELEASE_CODE-$env:RELEASE_VERSION"
          $assetPaths = @(
              "outputs/AnonForward-LSPosed-$env:RELEASE_VERSION.apk"
              "outputs/AnonForward-QAux-$env:RELEASE_VERSION.apk"
          )
          foreach ($assetPath in $assetPaths) {
              if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
                  throw "Missing release asset: $assetPath"
              }
          }

          $releaseExists = $false
          try {
              & gh release view $moduleTag --repo $env:MODULE_REPOSITORY *> $null
              $releaseExists = $true
          }
          catch [System.Management.Automation.NativeCommandExitException] {
              $releaseExists = $false
          }

          if ($releaseExists) {
              $assetNames = & gh release view $moduleTag `
                  --repo $env:MODULE_REPOSITORY `
                  --json assets `
                  --jq '.assets[].name'
              foreach ($assetPath in $assetPaths) {
                  $assetName = [System.IO.Path]::GetFileName($assetPath)
                  if ($assetNames -notcontains $assetName) {
                      & gh release upload $moduleTag $assetPath --repo $env:MODULE_REPOSITORY
                  }
              }
              & gh release edit $moduleTag `
                  --repo $env:MODULE_REPOSITORY `
                  --title "v$env:RELEASE_VERSION" `
                  --notes-file CHANGELOG.md
          }
          else {
              & gh release create $moduleTag @assetPaths `
                  --repo $env:MODULE_REPOSITORY `
                  --target main `
                  --title "v$env:RELEASE_VERSION" `
                  --notes-file CHANGELOG.md
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Xposed Modules Repo publication failed with exit code $LASTEXITCODE"
          }
